# Redrix only. Requires WirePlumber >= 0.5.13 and PipeWire >= 1.4.0.
# Empirical +20 dB input compensation, validated by recording on Redrix.
# Keep the normal input volume control independent of this fixed preamp.
node.filter-graph.rules = [
  {
    matches = [
      {
        node.name = "~^alsa_input[.].*-platform-adl_rt5682[^.]*[.]HiFi__Mic1__source$"
        alsa.card_name = "sof-rt5682"
        alsa.long_card_name = "~.*Redrix.*"
      }
    ]
    actions = {
      create-filter-graph = [
        {
          nodes = [
            {
              type = builtin
              name = redrix_preamp_l
              label = linear
              control = { Mult = 10.0 Add = 0.0 }
            }
            {
              type = builtin
              name = redrix_preamp_r
              label = linear
              control = { Mult = 10.0 Add = 0.0 }
            }
          ]
          inputs = [ "redrix_preamp_l:In" "redrix_preamp_r:In" ]
          outputs = [ "redrix_preamp_l:Out" "redrix_preamp_r:Out" ]
        }
      ]
    }
  }
]
