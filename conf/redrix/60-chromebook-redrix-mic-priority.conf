# Installed only when DMI product_name is Redrix.
# Prefer the internal mic over sink monitors on older WirePlumber releases,
# while keeping its priority below the wired headset on this card.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~^alsa_input[.].*-platform-adl_rt5682[^.]*[.]HiFi__Mic1__source$" }
    ]
    actions = {
      update-props = { priority.session = 1600 }
    }
  }
]
