# Screebo port selection. Names come from the common friendly-names rules.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
      { alsa.card_name = "sof-rt5682" }
    ]
    actions = {
      update-props = {
        api.acp.auto-port = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 2100
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*HiFi__Mic__source" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*HiFi__Headset__source" }
    ]
    actions = {
      update-props = {
        priority.session = 2300
      }
    }
  }
]
