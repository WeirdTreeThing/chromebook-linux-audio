# Screebo. The public mic slider writes channelVolumes on the loopback, so
# the preamp has to be on the raw DMIC node. channelmix.max-volume only
# sticks when it is set as the node is created. The node name is this
# card's id plus PCM 99; a star in the middle of that glob does not match.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.hw_sofrt5682_99" }
    ]
    actions = {
      update-props = {
        channelmix.max-volume = 64.0
        state.restore-props = false
      }
    }
  }
]

wireplumber.components = [
  {
    name = boost-internal-mic.lua
    type = script/lua
  }
]
