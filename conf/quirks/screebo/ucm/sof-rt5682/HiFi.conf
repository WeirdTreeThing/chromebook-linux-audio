# DMIC
#
# Screebo only. This sof-rt5682 profile is shared with other boards, and
# their live pair is not channels 2-3. SOF still exposes a 4ch PCM; on this
# board only channels 2-3 carry the array, so publish that pair alone.

Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "dmic_stereo_in"
			Direction Capture
			Format S32_LE
			Channels 2
			HWChannels 4
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
		}
	}
]

SectionDevice."Mic" {
	Comment "Internal Microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},${var:dmicpcm}"
		CaptureChannels 4
		CaptureMixerElem "Dmic0"
		CaptureVolume "Dmic0 Capture Volume"
		CaptureSwitch "Dmic0 Capture Switch"
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "dmic_stereo_in"
		Direction Capture
		Device "${var:dmicpcm}"
		HWChannels 4
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

Include.hdmi.File "/codecs/hda/${var:hdmi}.conf"
