# Marasov: physical internal DMIC is a 2ch array on PDM1.
# Keep in sync with WeirdTreeThing/alsa-ucm-conf-cros sof-rt5682/HiFi.conf.

# headset codecs

If.rt5682 {
	Condition {
		Type String
		Empty "$${var:rt5682}"
	}
	False.Include.headset.File "rt5682-headset.conf"
}

