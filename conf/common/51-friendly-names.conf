# Friendly names for cros UCM device names. Board-specific mic routing and
# gain live in conf/quirks/<product_name>/.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
      { alsa.long_card_name = "~Google-.*" }
    ]
    actions = {
      update-props = {
        device.description = "Built-in Audio"
        device.nick = "Built-in Audio"
        device.product.name = "Built-in Audio"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        node.description = "Speakers"
        device.profile.description = "Speakers"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        node.description = "Headphones"
        device.profile.description = "Headphones"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*HiFi__Mic__source" }
    ]
    actions = {
      update-props = {
        node.description = "Internal Microphone"
        device.profile.description = "Internal Microphone"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*HiFi__Headset__source" }
    ]
    actions = {
      update-props = {
        node.description = "Headset Microphone"
        device.profile.description = "Headset Microphone"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__HDMI1__sink" }
    ]
    actions = {
      update-props = {
        node.description = "HDMI 1"
        device.profile.description = "HDMI 1"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__HDMI2__sink" }
    ]
    actions = {
      update-props = {
        node.description = "HDMI 2"
        device.profile.description = "HDMI 2"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__HDMI3__sink" }
    ]
    actions = {
      update-props = {
        node.description = "HDMI 3"
        device.profile.description = "HDMI 3"
      }
    }
  }
]
